<!-- Via Simbólica · marca principal "o Sol que também é um olho". Geometria exata da capa do Design System: cartão 192×288, nove raios de 8 de largura entre os raios 64 e 176 do centro (96,232), a 0, ±22,5, ±45, ±67,5 e ±90 graus, disco de raio 32; tudo recortado pelo cartão. Não alterar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 288"><defs><clipPath id="placa"><rect width="192" height="288"/></clipPath></defs><g clip-path="url(#placa)"><g fill="#2E2E2E" transform="translate(96 232)"><rect x="-4" y="-176" width="8" height="112" transform="rotate(0)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(22.5)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(-22.5)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(45)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(-45)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(67.5)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(-67.5)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(90)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(-90)"/><circle r="32"/></g></g></svg>
