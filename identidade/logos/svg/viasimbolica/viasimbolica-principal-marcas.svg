<!-- Via Simbólica · marca principal, versão COMPLETA ("o Sol que também é um olho"). Cartão 464×288; nove raios de 8 de largura entre os raios 64 e 176 do centro (232,232), a 0, ±22,5, ±45, ±67,5 e ±90 graus, todos inteiros e do mesmo comprimento; disco de raio 32; margem de 56 nas laterais e no topo, centro do disco a 56 da base. Não alterar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 288"><g fill="#2E2E2E" transform="translate(232 232)"><rect x="-4" y="-176" width="8" height="112" transform="rotate(0)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(22.5)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(-22.5)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(45)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(-45)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(67.5)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(-67.5)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(90)"/><rect x="-4" y="-176" width="8" height="112" transform="rotate(-90)"/><circle r="32"/></g></svg>
